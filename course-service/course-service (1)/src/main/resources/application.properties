# path: course-service/src/main/resources/application.properties
# purpose: cau hinh cong chay va ket noi database cho course-service

# Đổi cổng chạy sang 8082 để không trùng với API Gateway (8080)
server.port=8082

spring.application.name=course-service

# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/course_db
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cấu hình Secret Key cho JWT
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te